name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test, type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs Vitest (prebuild), tsc --noEmit, then the Vite production build
      - name: Test & build
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker-image:
    name: Build production Docker image
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Verifies the full nginx image assembles (tests run again inside the
      # build stage). Add a registry login + push step here when publishing.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          tags: clone-dance:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
