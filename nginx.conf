server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Choreography JSONs are tens of MB; compress everything text-like
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # Vite emits content-hashed bundles: safe to cache forever
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # MediaPipe pose models and wasm runtime: large, rarely-changing binaries
    location ~* \.task$ {
        default_type application/octet-stream;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /mediapipe-wasm/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Sound effects rarely change
    location ~* \.(mp3|ogg|wav)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # config.json and choreographies: always revalidate so edits show up
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
